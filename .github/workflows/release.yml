name: Release

# Creates a GitHub release automatically whenever the version in manifest.json changes –
# but only after the full CI (lint, hassfest/HACS, backend and end-to-end tests) passed.
# Release notes come from CHANGELOG.md (fallback: commit messages).
on:
  push:
    branches: [main]
    paths: [custom_components/hauspanel/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: echo "version=$(jq -r .version custom_components/hauspanel/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V already exists"; exit 0; fi
          NOTES=$(awk -v v="## [$V]" 'index($0,v)==1{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREV" ]; then NOTES=$(git log --pretty='- %s' "$PREV"..HEAD); else NOTES=$(git log --pretty='- %s' -n 20); fi
          fi
          gh release create "v$V" --target "$GITHUB_SHA" --title "$V" --notes "$NOTES"
