name: Retag after history rewrite (one-off)

# Points every release tag at its rewritten commit. Removed again right after it ran.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r TAG SHA; do
            [ -z "$TAG" ] && continue
            git cat-file -e "$SHA^{commit}" || { echo "::error::$SHA missing for $TAG"; exit 1; }
            git tag -f "$TAG" "$SHA"
            git push -f origin "refs/tags/$TAG"
          done <<'MAP'
            v0.10.0 7be402987baeb60fe5f44859763ef2270a45f3f6
