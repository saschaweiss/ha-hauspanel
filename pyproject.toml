[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL", "BLE"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "E501"]

[tool.ruff.lint.isort]
known-local-folder = ["ha_server", "conftest"]
known-first-party = ["custom_components"]
